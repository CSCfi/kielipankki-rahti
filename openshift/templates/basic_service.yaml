apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: service-template
parameters:
  - name: SERVICE_NAME
    required: true
  - name: SERVICE_PORT
    required: true

objects:
  - kind: Service
    apiVersion: v1
    metadata:
      name: ${SERVICE_NAME}
      labels:
        io.kompose.service: ${SERVICE_NAME}
    spec:
      ports:
        - protocol: TCP
          port: ${{SERVICE_PORT}}
          targetPort: ${{SERVICE_PORT}}
      selector:
        io.kompose.service: ${SERVICE_NAME}
