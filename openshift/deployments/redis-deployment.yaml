apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: redis
  template:
    metadata:
      labels:
        io.kompose.service: redis
    spec:
      containers:
        - image: image-registry.apps.2.rahti.csc.fi/kielipankki-services/redis:latest
          name: redis
          ports:
            - containerPort: 6379
          # maxmemory in redis.conf is 2gb; the limit leaves room for
          # fragmentation and client buffers.
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 2560Mi
      restartPolicy: Always
